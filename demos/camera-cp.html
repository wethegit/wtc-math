<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera to CSS Transform — wtc-math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./camera-cp.css">
</head>
<body>

<div id="viewport">
  <div id="scene-3d">
    <div class="css-cube">
      <div class="cube-face front">front</div>
      <div class="cube-face back">back</div>
      <div class="cube-face right">right</div>
      <div class="cube-face left">left</div>
      <div class="cube-face top">top</div>
      <div class="cube-face bottom">bottom</div>
    </div>
  </div>
  <canvas id="scene-canvas"></canvas>
</div>

<div class="wordmark">
  <span class="w-lib">wtc</span><span class="w-dot">·</span><span class="w-mod">math</span>
</div>

<div class="info-overlay">
  <div class="info-panel panel--quat" id="quat-box">q = { x: 0.000, y: 0.000, z: 0.000, w: 1.000 }</div>
  <div class="info-panel panel--lookat" id="lookat-box">forward = { x: 0.000, y: 0.000, z: -1.000 }</div>
  <pre class="info-panel panel--code" id="code-box"></pre>
</div>

<script type="module" src="./camera-cp.js"></script>
</body>
</html>
